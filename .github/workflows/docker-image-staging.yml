name: Docker Image CI

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.TOKEN }}
    
    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile --tag ghcr.io/dolce-zampa/webservice:${{ github.ref_name }}
    
    - name: Push the Docker image
      run: |
        docker push ghcr.io/dolce-zampa/webservice:${{ github.ref_name }}

  deploy:
    runs-on: ubuntu-latest
    environment: prod
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Deploy to Docker Swarm 
        uses: appleboy/ssh-action@v1.2.0 
        with: 
          host: ${{ secrets.SWARM_HOST }} 
          username: ${{ secrets.SWARM_USER }} 
          key: ${{ secrets.SWARM_SSH_KEY }} 
          script: |
            export WEBSERVICE_STAGING_TAG=${{ github.ref_name }}
            docker service update --image ghcr.io/dolce-zampa/webservice:${WEBSERVICE_STAGING_TAG} dolcezampa_webservice

