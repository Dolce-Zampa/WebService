name: Docker Image CI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.TOKEN }}
    
    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile --tag ghcr.io/dolce-zampa/webservice:${{ github.ref_name }}

    - name: Push the Docker image
      run: |
        docker push ghcr.io/dolce-zampa/webservice:${{ github.ref_name }}

    - name: Deploy to Docker Swarm 
      uses: appleboy/ssh-action@v1.2.0 
      with: 
        host: ${{ secrets.SWARM_HOST }} 
        username: ${{ secrets.SWARM_USER }} 
        key: ${{ secrets.SWARM_SSH_KEY }} 
        script: | 
          export WEBSERVICE_TAG=${{ github.ref_name }} cd /opt/dolcezampa docker login ghcr.io \ -u ${{ github.actor }} \ -p ${{ secrets.TOKEN }} docker stack deploy \ --with-registry-auth \ -c docker-stack.yml \ dolcezampa

